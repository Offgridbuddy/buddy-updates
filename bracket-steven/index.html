var BAR = [[[20.0, -46.5, 0], [70.0, -46.5, 0], [70.0, -41.5, 0]], [[20.0, -46.5, 0], [70.0, -41.5, 0], [20.0, -41.5, 0]], [[20.0, -46.5, 10.0], [70.0, -41.5, 10.0], [70.0, -46.5, 10.0]], [[20.0, -46.5, 10.0], [20.0, -41.5, 10.0], [70.0, -41.5, 10.0]], [[20.0, -46.5, 0], [20.0, -46.5, 10.0], [70.0, -46.5, 0]], [[70.0, -46.5, 0], [20.0, -46.5, 10.0], [70.0, -46.5, 10.0]], [[70.0, -46.5, 0], [70.0, -46.5, 10.0], [70.0, -41.5, 0]], [[70.0, -41.5, 0], [70.0, -46.5, 10.0], [70.0, -41.5, 10.0]], [[70.0, -41.5, 0], [70.0, -41.5, 10.0], [20.0, -41.5, 0]], [[20.0, -41.5, 0], [70.0, -41.5, 10.0], [20.0, -41.5, 10.0]], [[20.0, -41.5, 0], [20.0, -41.5, 10.0], [20.0, -46.5, 0]], [[20.0, -46.5, 0], [20.0, -41.5, 10.0], [20.0, -46.5, 10.0]]];
function b64ToBuf(s){var bin=atob(s);var buf=new ArrayBuffer(bin.length);var u=new Uint8Array(buf);
  for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return buf;}
var tris=[],mins=[1e9,1e9,1e9],maxs=[-1e9,-1e9,-1e9];
function addTri(nrm,a,b,c,col){
  var t=[nrm[0],nrm[1],nrm[2],a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2],col];
  tris.push(t);
  for(var k=0;k<3;k++){var v=[a,b,c][k];
    for(var ax=0;ax<3;ax++){if(v[ax]<mins[ax])mins[ax]=v[ax]; if(v[ax]>maxs[ax])maxs[ax]=v[ax];}}
}
for(var pi=0;pi<PARTS.length;pi++){
  var P=PARTS[pi],buf=b64ToBuf(P.b64),dv=new DataView(buf),nTri=dv.getUint32(80,true);
  for(var i=0;i<nTri;i++){
    var o=84+i*50;
    var nrm=[dv.getFloat32(o,true),dv.getFloat32(o+4,true),dv.getFloat32(o+8,true)];
    var vs=[];
    for(var k=0;k<3;k++){
      vs.push([dv.getFloat32(o+12+k*12,true)+P.off[0],
               dv.getFloat32(o+16+k*12,true)+P.off[1],
               dv.getFloat32(o+20+k*12,true)+P.off[2]]);
    }
    addTri(nrm,vs[0],vs[1],vs[2],P.col);
  }
}
for(var bi=0;bi<BAR.length;bi++){
  var bt=BAR[bi];
  var ux=bt[1][0]-bt[0][0],uy=bt[1][1]-bt[0][1],uz=bt[1][2]-bt[0][2];
  var vx=bt[2][0]-bt[0][0],vy=bt[2][1]-bt[0][1],vz=bt[2][2]-bt[0][2];
  var nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;var nl=Math.hypot(nx,ny,nz)||1;
  addTri([nx/nl,ny/nl,nz/nl],bt[0],bt[1],bt[2],[90,90,90]);
}
var cen=[(mins[0]+maxs[0])/2,(mins[1]+maxs[1])/2,(mins[2]+maxs[2])/2];
var span=Math.max(maxs[0]-mins[0],maxs[1]-mins[1],maxs[2]-mins[2]);

var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){DPR=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';draw();}
window.addEventListener('resize',resize);

var yaw=-0.7,pitch=0.9,zoom=1,panX=0,panY=0,autoSpin=false;
function resetView(){yaw=-0.7;pitch=0.9;zoom=1;panX=0;panY=0;draw();}
var L=[0.45,-0.6,0.75];var ll=Math.hypot(L[0],L[1],L[2]);L=[L[0]/ll,L[1]/ll,L[2]/ll];

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#e8e6e1';ctx.fillRect(0,0,W,H);
  var scale=(Math.min(W,H)*0.92/span)*zoom;
  var cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  var cx=W/2+panX,cyv=H/2+panY;
  var proj=[];
  for(var i=0;i<tris.length;i++){
    var t=tris[i];
    var nx=t[0],ny=t[1],nz=t[2];
    var rx1=nx*cy-nz*sy, rz1=nx*sy+nz*cy;
    var rn=[rx1, ny*cp-rz1*sp, ny*sp+rz1*cp];
    var sh=0.35+0.65*Math.abs(rn[0]*L[0]+rn[1]*L[1]+rn[2]*L[2]);
    var pts=[],zs=0;
    for(var k=0;k<3;k++){
      var x=t[3+k*3]-cen[0],y=t[4+k*3]-cen[1],z=t[5+k*3]-cen[2];
      var X=x*cy-z*sy, Z=x*sy+z*cy;
      var Y=y*cp-Z*sp, Z2=y*sp+Z*cp;
      pts.push([cx+X*scale, cyv-Y*scale]); zs+=Z2;
    }
    proj.push([zs/3,sh,pts,t[12]]);
  }
  proj.sort(function(a,b){return a[0]-b[0];});
  for(var j=0;j<proj.length;j++){
    var s=proj[j][1],p=proj[j][2],base=proj[j][3];
    var r=Math.round(base[0]*s+30*(1-s)),g=Math.round(base[1]*s+30*(1-s)),b=Math.round(base[2]*s+28*(1-s));
    ctx.fillStyle='rgb('+r+','+g+','+b+')';
    ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);ctx.lineTo(p[1][0],p[1][1]);ctx.lineTo(p[2][0],p[2][1]);
    ctx.closePath();ctx.fill();
  }
  if(autoSpin){yaw+=0.02;requestAnimationFrame(draw);}
}

var touches={},lastPinch=0,lastTap=0,moved=0;
function posOf(e){return [e.clientX,e.clientY];}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);touches[e.pointerId]=posOf(e);moved=0;});
cv.addEventListener('pointermove',function(e){
  if(!(e.pointerId in touches))return;
  var p=posOf(e),old=touches[e.pointerId];touches[e.pointerId]=p;
  var ids=Object.keys(touches);
  if(ids.length===1){
    yaw+=(p[0]-old[0])*0.01; pitch+=(p[1]-old[1])*0.01;
    if(pitch>Math.PI)pitch=Math.PI; if(pitch<-Math.PI)pitch=-Math.PI;
    moved+=Math.abs(p[0]-old[0])+Math.abs(p[1]-old[1]); draw();
  }else if(ids.length===2){
    var a=touches[ids[0]],b=touches[ids[1]];
    var d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(lastPinch>0){
      if(Math.abs(d-lastPinch)>2){zoom*=d/lastPinch; if(zoom<0.2)zoom=0.2; if(zoom>8)zoom=8;}
      else{panX+=(p[0]-old[0])/2;panY+=(p[1]-old[1])/2;}
    }
    lastPinch=d; draw();
  }
});
function endTouch(e){delete touches[e.pointerId];if(Object.keys(touches).length<2)lastPinch=0;
  var now=Date.now();
  if(e.type==='pointerup'&&moved<6){if(now-lastTap<350){resetView();}lastTap=now;}}
cv.addEventListener('pointerup',endTouch);
cv.addEventListener('pointercancel',endTouch);
cv.addEventListener('wheel',function(e){e.preventDefault();zoom*=e.deltaY<0?1.1:0.9;
  if(zoom<0.2)zoom=0.2;if(zoom>8)zoom=8;draw();},{passive:false});

document.getElementById('bTop').onclick=function(){pitch=Math.PI/2;draw();};
document.getElementById('bFront').onclick=function(){pitch=0;yaw=0;draw();};
document.getElementById('bSide').onclick=function(){pitch=0;yaw=Math.PI/2;draw();};
document.getElementById('bReset').onclick=function(){autoSpin=false;document.getElementById('bSpin').className='';resetView();};
document.getElementById('bSpin').onclick=function(){autoSpin=!autoSpin;this.className=autoSpin?'on':'';if(autoSpin)draw();};
resize();
</script>
<script>var keyEl=document.getElementById('key');if(keyEl){keyEl.addEventListener('click',function(){var closed=keyEl.classList.toggle('closed');var kt=keyEl.querySelector('.kt');if(kt){kt.textContent=closed?kt.textContent.replace('tap to close','tap to open'):kt.textContent.replace('tap to open','tap to close');}});}</script></body>
